# Build the Arkari (goron-based LLVM obfuscator) clang for a SELECTED branch and upload it.
#
# Arkari is a FULL LLVM monorepo: all obfuscation passes are compiled INTO clang, so the build
# needs no flag/NDK choices. You enable obfuscation later, at COMPILE time, with -mllvm flags
# (e.g. -mllvm -irobf -mllvm -irobf-cse ...), using your own NDK.
#
# Output: an artifact "arkari-clang-<branch>" containing clang / clang++ (host: x86_64 Linux) plus
# an install-into-ndk.sh helper. Drop it into the NDK whose clang major matches the branch:
#   llvm-18.x -> NDK r27c (clang 18) ,  llvm-19.x -> r28c (clang 19) ,  llvm-21.x -> r29 (clang 21).
name: build-arkari-select

on:
  workflow_dispatch:
    inputs:
      obf_branch:
        description: "Arkari branch (LLVM version) to build"
        type: choice
        default: llvm-21.x
        options:
          - llvm-23.x
          - llvm-22.x
          - llvm-21.x
          - llvm-20.x
          - llvm-19.x
          - llvm-18.x
          - llvm-17.x
          - llvm-16.x
          - llvm-15.x
          - llvm-14.x
      runner:
        description: "Build machine (ubuntu-latest recommended; produces a Linux x86_64 clang)"
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - ubuntu-22.04
          - self-hosted

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 350
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build ccache lld clang python3 git binutils

      - name: Checkout selected Arkari branch (shallow)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.obf_branch }}
          submodules: false
          fetch-depth: 1

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-arkari-${{ inputs.obf_branch }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-arkari-${{ inputs.obf_branch }}-${{ runner.os }}-

      - name: Configure clang build
        run: |
          set -euxo pipefail
          cmake -G Ninja -S llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang" \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_OPTIMIZED_TABLEGEN=ON \
            -DLLVM_USE_LINKER=lld \
            -DLLVM_CCACHE_BUILD=ON \
            -DLLVM_PARALLEL_LINK_JOBS=2 \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DCLANG_ENABLE_ARCMT=OFF \
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF

      - name: Build clang (with Arkari obfuscation compiled in)
        run: |
          set -euxo pipefail
          ninja -C build clang
          ./build/bin/clang --version

      - name: Package obfuscating clang toolchain
        if: always()
        run: |
          set -uxo pipefail
          rm -rf dist && mkdir -p dist/bin
          if [ ! -f build/bin/clang ]; then echo "::warning::clang was not built."; exit 0; fi
          cp build/bin/clang dist/bin/clang
          cp build/bin/clang dist/bin/clang++
          strip dist/bin/clang dist/bin/clang++ 2>/dev/null || true
          cat > dist/install-into-ndk.sh <<'SH'
          #!/usr/bin/env bash
          # Drop the Arkari obfuscating clang into an NDK whose clang major matches this build.
          # Usage: ./install-into-ndk.sh /path/to/android-ndk-rXX
          set -euo pipefail
          NDK="${1:?pass the NDK path, e.g. /home/you/android-ndk-r29}"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          [ -d "$BIN" ] || { echo "Not an NDK toolchain bin dir: $BIN"; exit 1; }
          here="$(cd "$(dirname "$0")" && pwd)"
          for f in clang clang++; do
            [ -e "$BIN/$f.orig" ] || cp -a "$BIN/$f" "$BIN/$f.orig"
            install -m0755 "$here/bin/$f" "$BIN/$f"
          done
          echo "Installed obfuscating clang into $BIN (originals saved as clang.orig / clang++.orig)."
          echo "Enable obfuscation with -mllvm flags and build at -O1+ (NOT APP_OPTIM=debug)."
          SH
          chmod +x dist/install-into-ndk.sh
          cat > dist/README.txt <<'TXT'
          Arkari obfuscating clang  (HOST binary: x86_64 Linux; runs on Ubuntu, emits arm64).
          ================================================================================
          Install into a version-matched NDK (transparent for ndk-build / CMake / gradle):
            ./install-into-ndk.sh /path/to/android-ndk-rXX      (restore: copy clang.orig back)

          Enable obfuscation at COMPILE time (e.g. ndk-build: LOCAL_CPPFLAGS += ...):
            -mllvm -irobf                 enable (required)
            -mllvm -irobf-cse             C-string encryption
            -mllvm -irobf-fla             control-flow flattening   (llvm-20.x uses -irobf-cff)
            -mllvm -irobf-indbr           indirect branches
            -mllvm -irobf-icall           indirect calls
            -mllvm -irobf-indgv           indirect global refs
            -mllvm -irobf-cie             integer-constant encryption
            -mllvm -irobf-cfe            FP-constant encryption
          Passes only run at -O1 or higher. Per-function control: [[clang::annotate("+fla +cse")]].
          TXT
          du -h dist/bin/* || true

      - name: Upload obfuscating clang toolchain
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arkari-clang-${{ inputs.obf_branch }}
          path: dist/**
          if-no-files-found: warn
